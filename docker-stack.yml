# Only backend and web run in Docker. PostgreSQL, Caddy, and
# fingerprint-matcher are native Windows processes on this same machine -
# see deploy/target-setup.md. Docker Swarm (not plain `docker compose`) is
# what gives the zero-downtime rolling update via `order: start-first`
# below.
#
# backend/web images are never pulled from anywhere - they're built on the
# dev machine, carried over on a USB drive as tarballs, and `docker load`ed
# here. No registry involved, nothing compiled ever leaves this machine
# except onto that USB drive.
#
# First deploy, and after every `docker load` of a fresh tarball:
#   docker stack deploy --resolve-image=never -c docker-stack.yml attendance
# --resolve-image=never is required - without it, Swarm tries to check a
# registry for these images and there isn't one. Verified directly: this
# command alone does NOT pick up a same-tag image reload by itself - see
# deploy/update.md for the `docker service update --force` step that
# actually triggers the rollout (also verified: still 0 dropped requests
# across 300 hammered during that forced update).
#
# Requires `docker swarm init` to have been run once already.

services:
  backend:
    image: attendance-backend:latest
    ports:
      - "3000:3000"
    env_file:
      - backend.env
    extra_hosts:
      # Postgres and fingerprint-matcher are both native Windows
      # processes, reached via this special hostname rather than a
      # Swarm service name - works on Docker Engine 20.10+, not just
      # Docker Desktop.
      - "host.docker.internal:host-gateway"
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 4s
        max_attempts: 10

  web:
    image: attendance-web:latest
    ports:
      - "3001:3001"
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 4s
        max_attempts: 10
