# Only backend and web run in Docker. PostgreSQL, Caddy, and
# fingerprint-matcher are native Windows processes on this same machine -
# see deploy/target-setup.md. Docker Swarm (not plain `docker compose`) is
# what gives the zero-downtime rolling update via `order: start-first`
# below.
#
# backend/web are pulled from GitHub Container Registry as public images -
# no `docker login`, no auth needed on this machine at all.
#
# Deploy (or update) with:
#   docker stack deploy -c docker-stack.yml attendance
# Verified directly (in an earlier version of this stack): this always
# resolves the current :latest digest and only actually restarts a
# service whose image content changed - no --force flag needed.
#
# Requires `docker swarm init` to have been run once already.

services:
  backend:
    image: ghcr.io/ericcrick/attendance-backend:latest
    ports:
      - "3000:3000"
    env_file:
      - backend.env
    extra_hosts:
      # Postgres and fingerprint-matcher are both native Windows
      # processes, reached via this special hostname rather than a
      # Swarm service name - works on Docker Engine 20.10+, not just
      # Docker Desktop.
      - "host.docker.internal:host-gateway"
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 4s
        max_attempts: 10

  web:
    image: ghcr.io/ericcrick/attendance-web:latest
    ports:
      - "3001:3001"
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 4s
        max_attempts: 10
