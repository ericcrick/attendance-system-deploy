# Everything runs in Docker now - Postgres, Caddy, and the three app
# services - under a single Docker Swarm stack (not plain `docker compose`;
# Swarm is what gives the zero-downtime rolling update via
# `order: start-first` below). Nothing else needs to be installed natively
# on the target machine except Docker itself.
#
# backend/web/fingerprint-matcher are pulled from GitHub Container
# Registry as public images - no `docker login`, no auth needed on this
# machine at all. postgres/caddy are public Docker Hub images, same deal.
#
# Deploy (or update) with:
#   docker stack deploy -c docker-stack.yml attendance
# Verified directly: this always resolves the current :latest digest and
# only actually restarts a service whose image content changed - no
# --force flag needed even for a normal update.
#
# Requires `docker swarm init` to have been run once already (see
# deploy/target-setup.md).

services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - attendance
    deploy:
      replicas: 1
      update_config:
        # Postgres is stateful and owns the data volume - never attempt to
        # start a second one against the same volume before the first
        # stops, unlike the stateless app services below.
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 4s
        max_attempts: 10

  backend:
    image: ghcr.io/ericcrick/attendance-backend:latest
    env_file:
      - backend.env
    depends_on:
      - postgres
    networks:
      - attendance
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 4s
        max_attempts: 10

  web:
    image: ghcr.io/ericcrick/attendance-web:latest
    networks:
      - attendance
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 4s
        max_attempts: 10

  fingerprint-matcher:
    image: ghcr.io/ericcrick/attendance-fingerprint-matcher:latest
    # No ports published - only `backend` talks to this, over the Swarm
    # network's internal DNS (http://fingerprint-matcher:5000).
    networks:
      - attendance
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 4s
        max_attempts: 10

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend
      - web
    networks:
      - attendance
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 4s
        max_attempts: 10

networks:
  # attachable: true - so `docker run --network attendance_attendance ...`
  # (e.g. the one-off migration command in deploy/update.md) can join this
  # network too. Swarm's auto-created network for a stack is NOT
  # attachable by plain `docker run` by default - found this the hard way
  # trying to run migrations against it.
  attendance:
    driver: overlay
    attachable: true

volumes:
  pgdata:
  caddy_data:
